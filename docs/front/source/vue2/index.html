<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app">{{name}}, {{namePlus}}</div>
    <script src="./vue2.js"></script>
    <script>
      const vueIns = new Vue({
        el: "#app",
        data() {
          return {
            name: "zs",
          };
        },
        watch: {
          name() {
            console.log("changed");
          },
        },
        mounted() {
          this.name = "ls";
        },
        computed: {
          namePlus() {
            return this.name + "233";
          },
        },
      });
    </script>
  </body>
</html>
